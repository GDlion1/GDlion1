<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
  <title id="t">Project 02: RAG System</title><desc id="d">A violet and black project panel for document-grounded PDF question answering with vector search.</desc>
  <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".1"/></pattern><style>.h{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Impact,Arial,sans-serif;font-weight:900;letter-spacing:-1px}.m{font-family:'Space Mono','JetBrains Mono','Courier New',monospace;font-weight:700;letter-spacing:1.8px}.f{transform-box:fill-box;transform-origin:center;animation:f 3.5s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(3deg)}}@media(prefers-reduced-motion:reduce){.f{animation:none}}</style></defs>
